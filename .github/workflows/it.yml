name: Web3 URL Link Checker
env:
  ACTIONS_RUNNER_DEBUG: true
  ACTIONS_STEP_DEBUG: true
on:
  schedule:
    - cron: "0 9,17 * * *" # Every day at 6 PM and 3 AM UTC+8
    - cron: "0 2 * * *" # Every day at 11 AM UTC+8

  workflow_dispatch: # Manual trigger

permissions:
  contents: read

jobs:
  add-links:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.add-links.outputs.result }}
      started_at: ${{ steps.capture-time.outputs.started_at }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Capture Start Time
        id: capture-time
        run: |
          echo "started_at=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S %Z')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --prefix it/scripts

      - name: Add Links
        id: add-links
        timeout-minutes: 30
        working-directory: it/scripts
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          L1_RPC_MAINNET: ${{ secrets.L1_RPC_MAINNET }}
          L1_RPC_SEP: ${{ secrets.L1_RPC_SEP }}
        run: |
          node --input-type=module << 'EOF'
          import { appendFileSync } from 'node:fs';
          import { addLinks } from './add-links.mjs';

          let result;
          try {
            result = await addLinks();
          } catch (err) {
            result = { links: [], errors: [err.message || String(err)] };
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `result=${JSON.stringify(result)}\n`);
          if (result.errors.length) {
            process.exitCode = 1;
          }
          EOF

  check-links:
    needs: add-links
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.link-check.outputs.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --prefix it/scripts

      - name: Check Links
        id: link-check
        timeout-minutes: 30
        working-directory: it/scripts
        env:
          ADD_LINK_RESULT: ${{ needs.add-links.outputs.result || '{}' }}
          ADD_LINK_STATUS: ${{ needs.add-links.result }}
        run: |
          node --input-type=module << 'EOF'
          import { appendFileSync } from 'node:fs';
          import { checkAllLinks } from './check-links.mjs';
          import { links } from '../data/links.mjs';

          const generated = JSON.parse(process.env.ADD_LINK_RESULT);
          const created = generated.links || [];
          const errors = generated.errors || [];
          if (process.env.ADD_LINK_STATUS !== 'success' && !errors.length) {
            errors.push('Link generation did not complete; see the add-links job.');
          }
          const failures = await checkAllLinks([...links, ...created]);
          errors.push(...Array.from(failures, ([url, error]) => `${url} -> ${error}`));
          const result = {
            static_links_total: links.length,
            summary: generated.summaryTable || '',
            l1_summary: generated.l1InfoTable || '',
            created: created.map(link => `- ${link}`).join('\n'),
            failures: errors.join('\n'),
          };
          appendFileSync(process.env.GITHUB_OUTPUT, `result=${JSON.stringify(result)}\n`);
          if (errors.length) {
            console.error(result.failures);
            process.exitCode = 1;
          }
          EOF

  notify:
    needs: [add-links, check-links]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Failure Email
        if: ${{ needs.add-links.result != 'success' || needs.check-links.result != 'success' }}
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          convert_markdown: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ Web3Gateway Links Failure"
          html_body: |
            ## 🚨 Link Check Failed

            - **Outcome:** `${{ needs.check-links.result }}`
            - **Triggered By:** `${{ github.event_name }}` at `${{ needs.add-links.outputs.started_at }}`

            ---

            ### Link Failures
            ${{ fromJSON(needs.check-links.outputs.result || '{}').failures || 'Link generation or checking did not complete; see the workflow logs.' }}

            ### L1 Gas Prices
            ${{ fromJSON(needs.check-links.outputs.result || '{}').l1_summary }}

            ### Cost Summary
            ${{ fromJSON(needs.check-links.outputs.result || '{}').summary }}

            ### New Links
            ${{ fromJSON(needs.check-links.outputs.result || '{}').created }}

            _(static link list trimmed · total `${{ fromJSON(needs.check-links.outputs.result || '{}').static_links_total }}` entries)_

          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: Web3Gateway

      - name: Send Daily Success Email
        if: ${{ needs.add-links.result == 'success' && needs.check-links.result == 'success' && (github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch') }}
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          convert_markdown: true
          username: ${{secrets.SMTP_USERNAME}}
          password: ${{secrets.SMTP_PASSWORD}}
          subject: "✅ Web3Gateway Links Check Successful"
          html_body: |
            ## ✅ All Links Healthy

            - **Outcome:** `${{ needs.check-links.result }}`
            - **Triggered By:** `${{ github.event_name }}` at `${{ needs.add-links.outputs.started_at }}`

            ---

            ### L1 Gas Prices
            ${{ fromJSON(needs.check-links.outputs.result || '{}').l1_summary }}
            
            ### Cost Summary
            ${{ fromJSON(needs.check-links.outputs.result || '{}').summary }}

            ### New Links
            ${{ fromJSON(needs.check-links.outputs.result || '{}').created }}

            _(static link list trimmed · total `${{ fromJSON(needs.check-links.outputs.result || '{}').static_links_total }}` entries)_

          to: ${{secrets.NOTIFICATION_EMAIL}}
          from: Web3Gateway
